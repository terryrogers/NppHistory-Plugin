name: One-time artifact storage cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-artifact-cleanup.yml]

permissions: {}

jobs:
  cleanup:
    if: github.repository == 'terryrogers/NppHistory-Plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Remove audited build artifacts older than 30 days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          
          EXPECTED_REPO = "terryrogers/NppHistory-Plugin"
          TARGETS = [{"id":10638970956,"name":"NppHistory-x64-fc4d79d2e2f8cb6155c793d343264a765f8dda72","size_in_bytes":592109,"created_at":"2026-09-21T12:38:11Z"},{"id":10637989812,"name":"NppHistory-x64-77736ebf19c9a82e297f0fde2915edf814381cd4","size_in_bytes":592112,"created_at":"2026-09-21T12:34:55Z"},{"id":10637665946,"name":"NppHistory-x64-22e0d19cad6a9850527fbb34434954cc55223dd8","size_in_bytes":592113,"created_at":"2026-09-21T12:09:55Z"},{"id":10637325562,"name":"NppHistory-x64-9a931998701c77079562c5fc94c5c7c862efb404","size_in_bytes":592113,"created_at":"2026-09-21T11:53:28Z"},{"id":10634552326,"name":"NppHistory-x64-49030052aa5c7ae062074f77227f3fb0ed9397fd","size_in_bytes":592109,"created_at":"2026-09-21T10:53:51Z"},{"id":10634176523,"name":"NppHistory-x64-1cb4fc02c39c028186555eabf381afc0d4c2ca22","size_in_bytes":592109,"created_at":"2026-09-21T10:40:44Z"},{"id":10633501129,"name":"NppHistory-x64-c729d8982c7a6e6d677e0641601ce9542c636846","size_in_bytes":592110,"created_at":"2026-09-21T10:21:09Z"},{"id":10632862347,"name":"NppHistory-x64-363db85a0ec7ffcb9fd3cbcbc555b673e9a26ad8","size_in_bytes":592107,"created_at":"2026-09-21T10:04:04Z"},{"id":10576003336,"name":"NppHistory-x64-6b1785fba316c72617cf0a9ac60559e4c68424a0","size_in_bytes":592111,"created_at":"2026-09-19T03:09:55Z"},{"id":10529491547,"name":"NppHistory-x64-9760d13fad41896dfa97ce3231d27514feb27bd9","size_in_bytes":592114,"created_at":"2026-09-18T02:37:41Z"},{"id":10526018719,"name":"NppHistory-x64-e4d1680ea93b7ec90944aedadaffab276a2e49ff","size_in_bytes":592110,"created_at":"2026-09-18T00:20:32Z"},{"id":10521511592,"name":"NppHistory-x64-8c875ad604c25513f7cf43a7fedc8b91019e67d5","size_in_bytes":592111,"created_at":"2026-09-17T21:37:37Z"},{"id":10328703476,"name":"NppHistory-x64-52ddc4fa3a1aa542cf6f5f2e415c9855313d7e36","size_in_bytes":592111,"created_at":"2026-09-14T00:27:01Z"},{"id":10328104503,"name":"NppHistory-x64-99d924e7425abf139af4f2de816f612d088373ff","size_in_bytes":592113,"created_at":"2026-09-14T00:21:41Z"}]
          CUTOFF = datetime(2026, 9, 23, tzinfo=timezone.utc)
          
          def api(method, artifact_id):
              url = f"https://api.github.com/repos/{EXPECTED_REPO}/actions/artifacts/{artifact_id}"
              request = urllib.request.Request(url, method=method, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise RuntimeError(f"GitHub {method} failed: HTTP {error.code}") from None
          
          def main():
              if os.environ["GITHUB_REPOSITORY"] != EXPECTED_REPO:
                  raise RuntimeError("Unexpected repository; refusing cleanup")
              # Validate every candidate before making any destructive request.
              candidates = []
              for target in TARGETS:
                  artifact = api("GET", target["id"])
                  if artifact is None:
                      continue
                  if any(artifact.get(key) != value for key, value in target.items()):
                      raise RuntimeError(f"Artifact metadata changed: {target['id']}")
                  created = datetime.fromisoformat(artifact["created_at"].replace("Z", "+00:00"))
                  if created >= CUTOFF:
                      raise RuntimeError(f"Artifact is too recent: {target['id']}")
                  candidates.append(target)
              removed_bytes = 0
              for target in candidates:
                  api("DELETE", target["id"])
                  if api("GET", target["id"]) is not None:
                      raise RuntimeError(f"Artifact still exists: {target['id']}")
                  removed_bytes += target["size_in_bytes"]
                  print(f"Removed artifact {target['id']} ({target['size_in_bytes']} bytes)")
              summary = f"Removed {len(candidates)} artifacts; {removed_bytes} bytes reclaimed."
              print(summary)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary + "\n")
          
          if __name__ == "__main__":
              main()
          PY
