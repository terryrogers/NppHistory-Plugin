name: Windows build and core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build plugin
        run: msbuild .\vs.proj\NppHistory.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64

      - name: Build restart installer
        run: msbuild .\vs.proj\NppHistoryUpdater.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64

      - name: Build core tests
        run: msbuild .\vs.proj\NppHistory.Tests.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64

      - name: Run core tests
        run: .\build\tests\NppHistory.Tests.exe

      - name: Run restart installer smoke tests
        shell: pwsh
        run: |
          $result = & .\tests\updater_smoke.ps1
          $result | Format-List
          if (-not $result.Passed) {
            throw 'Restart installer smoke tests failed.'
          }

      - name: Upload plugin package files
        uses: actions/upload-artifact@v7
        with:
          name: NppHistory-x64-${{ github.sha }}
          path: |
            build/x64/Release/NppHistory.dll
            build/x64/Release/NppHistoryUpdater.exe
          if-no-files-found: error
